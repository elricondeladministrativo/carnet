<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Carnet</title>
<meta name="theme-color" content="#0f1b2d">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#0f1b2d; --card:#17263d; --text:#eef2f7; --muted:#9fb0c6;
    --accent:#3d8bfd; --danger:#e5484d; --border:#26395a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
       padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:16px 0}
  h1{font-size:1.2rem;margin:0;font-weight:600}
  main{flex:1;display:flex;flex-direction:column;gap:16px;max-width:720px;width:100%;margin:0 auto}
  .empty{background:var(--card);border:1px dashed var(--border);border-radius:16px;padding:32px 20px;text-align:center}
  .empty p{color:var(--muted);line-height:1.5}
  .cardwrap{background:#fff;border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
  .cardwrap img{display:block;width:100%;height:auto;border-radius:8px}
  .meta{color:var(--muted);font-size:.85rem;text-align:center}
  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button,.btn{appearance:none;border:1px solid var(--border);background:var(--card);color:var(--text);
       padding:14px 12px;border-radius:12px;font-size:1rem;font-weight:500;cursor:pointer;text-align:center}
  button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.danger{color:var(--danger)}
  .full{grid-column:1 / -1}
  #install{display:none;padding:8px 14px;font-size:.9rem}
  #fs{position:fixed;inset:0;background:#000;display:none;align-items:center;justify-content:center;z-index:10}
  #fs img{max-width:100vw;max-height:100vh;object-fit:contain;background:#fff}
  #fs.rot img{transform:rotate(90deg);max-width:100vh;max-height:100vw}
  #fs .close{position:absolute;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(255,255,255,.15);
       border:none;color:#fff;padding:10px 14px;border-radius:10px}
  .hidden{display:none!important}
  #status{color:var(--muted);text-align:center;min-height:1.2em}
</style>
</head>
<body>
<header>
  <h1>Mi Carnet</h1>
  <button id="install">Instalar</button>
</header>

<main>
  <section id="emptyView" class="empty">
    <h2 style="margin-top:0">Cargá tu carnet</h2>
    <p>Elegí el PDF de tu habilitación. Se guarda <strong>solo en este teléfono</strong>; no se sube a ningún servidor.</p>
    <label class="btn primary" style="display:inline-block">
      Elegir PDF
      <input id="fileInput" type="file" accept="application/pdf" hidden>
    </label>
  </section>

  <section id="cardView" class="hidden">
    <div class="cardwrap" id="cardTap"><img id="cardImg" alt="Carnet"></div>
    <p class="meta" id="meta"></p>
    <div class="actions">
      <button class="primary full" id="btnFull">Mostrar en pantalla completa</button>
      <button id="btnDownload">Descargar PDF</button>
      <label class="btn">Reemplazar<input id="fileInput2" type="file" accept="application/pdf" hidden></label>
      <button class="danger full" id="btnDelete">Borrar del teléfono</button>
    </div>
  </section>

  <p id="status"></p>
</main>

<div id="fs"><img id="fsImg" alt="Carnet"><button class="close" id="fsClose">Cerrar</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ---------- IndexedDB ---------- */
const DB='mi-carnet', STORE='docs', KEY='carnet';
function db(){return new Promise((res,rej)=>{const r=indexedDB.open(DB,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function put(v){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');
  t.objectStore(STORE).put(v,KEY);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function get(){const d=await db();return new Promise((res,rej)=>{const r=d.transaction(STORE).objectStore(STORE).get(KEY);
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function del(){const d=await db();return new Promise((res,rej)=>{const t=d.transaction(STORE,'readwrite');
  t.objectStore(STORE).delete(KEY);t.oncomplete=res;t.onerror=()=>rej(t.error);});}

/* ---------- Render PDF -> imagen recortada ---------- */
async function pdfToImage(buf){
  const pdf=await pdfjsLib.getDocument({data:buf}).promise;
  const page=await pdf.getPage(1);
  const vp=page.getViewport({scale:4});
  const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
  const ctx=c.getContext('2d',{willReadFrequently:true});
  ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise;
  // recorta los márgenes blancos para que quede solo el carnet
  const {data,width,height}=ctx.getImageData(0,0,c.width,c.height);
  let x0=width,y0=height,x1=0,y1=0;
  for(let y=0;y<height;y+=2)for(let x=0;x<width;x+=2){
    const i=(y*width+x)*4;
    if(data[i]<235||data[i+1]<235||data[i+2]<235){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  }
  if(x1<=x0||y1<=y0)return c.toDataURL('image/png');
  const pad=12;x0=Math.max(0,x0-pad);y0=Math.max(0,y0-pad);
  x1=Math.min(width,x1+pad);y1=Math.min(height,y1+pad);
  const o=document.createElement('canvas');o.width=x1-x0;o.height=y1-y0;
  o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
let current=null;

function show(rec){
  current=rec;
  if(!rec){$('emptyView').classList.remove('hidden');$('cardView').classList.add('hidden');return;}
  $('emptyView').classList.add('hidden');$('cardView').classList.remove('hidden');
  $('cardImg').src=rec.image;$('fsImg').src=rec.image;
  $('meta').textContent=`${rec.name} · cargado el ${new Date(rec.date).toLocaleDateString('es-AR')}`;
}

async function load(file){
  if(!file)return;
  $('status').textContent='Procesando…';
  try{
    const buf=await file.arrayBuffer();
    const image=await pdfToImage(buf.slice(0));
    const rec={pdf:new Blob([buf],{type:'application/pdf'}),image,name:file.name,date:Date.now()};
    await put(rec);show(rec);$('status').textContent='';
  }catch(e){console.error(e);$('status').textContent='No se pudo leer el PDF.';}
}
$('fileInput').onchange=e=>load(e.target.files[0]);
$('fileInput2').onchange=e=>load(e.target.files[0]);

$('btnDownload').onclick=()=>{
  if(!current)return;
  const url=URL.createObjectURL(current.pdf);
  const a=document.createElement('a');a.href=url;a.download=current.name||'carnet.pdf';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);
};

$('btnDelete').onclick=async()=>{
  if(!confirm('¿Borrar el carnet de este teléfono?'))return;
  await del();show(null);
};

/* Pantalla completa, horizontal y sin que se apague la pantalla */
let wake=null;
async function openFs(){
  const fs=$('fs');fs.style.display='flex';
  try{await fs.requestFullscreen?.();}catch{}
  let locked=false;
  try{await screen.orientation.lock('landscape');locked=true;}catch{}
  fs.classList.toggle('rot',!locked&&innerHeight>innerWidth);
  try{wake=await navigator.wakeLock?.request('screen');}catch{}
}
async function closeFs(){
  $('fs').style.display='none';
  try{screen.orientation.unlock?.();}catch{}
  try{if(document.fullscreenElement)await document.exitFullscreen();}catch{}
  try{await wake?.release();}catch{} wake=null;
}
$('btnFull').onclick=openFs;$('cardTap').onclick=openFs;$('fsClose').onclick=closeFs;
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&$('fs').style.display==='flex')closeFs();});

/* Botón instalar */
let deferred=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').style.display='block';});
$('install').onclick=async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;$('install').style.display='none';};

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
get().then(show).catch(()=>show(null));
</script>
</body>
</html>
